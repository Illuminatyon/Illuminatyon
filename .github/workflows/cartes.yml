# Génère les cartes de stats (stats, langages, série) dans le dossier profile/
# Tourne chaque nuit, et peut être lancé à la main depuis l'onglet Actions.
name: Mise à jour des cartes

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cartes.yml"

jobs:
  cartes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Carte des statistiques
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&locale=fr&custom_title=STATS.EXE&bg_color=0B0B0D&title_color=8B5CF6&text_color=F2F1F5&icon_color=8B5CF6&ring_color=8B5CF6&border_color=8B5CF6&border_radius=0"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Carte des langages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&locale=fr&custom_title=LANGAGES.DLL&bg_color=0B0B0D&title_color=8B5CF6&text_color=F2F1F5&border_color=8B5CF6&border_radius=0"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Carte de la série de contributions
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&locale=fr&background=0B0B0D&border=8B5CF6&stroke=8B5CF6&ring=8B5CF6&fire=C4B5FD&currStreakNum=F2F1F5&sideNums=F2F1F5&currStreakLabel=8B5CF6&sideLabels=9C9AA6&dates=9C9AA6&border_radius=0"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enregistrer les cartes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Mise à jour des cartes" || exit 0
          git push
