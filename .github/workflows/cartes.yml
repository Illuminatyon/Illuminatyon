# Génère les cartes de statistiques dans profile/, aux couleurs du bandeau.
# Tourne chaque nuit, et peut être lancé à la main depuis l'onglet Actions.
name: Mise à jour des cartes

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cartes.yml"

jobs:
  cartes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Carte des statistiques
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_rank=false&locale=fr&bg_color=F1EBDD&title_color=2F54EB&text_color=141414&icon_color=2F54EB&ring_color=2F54EB&border_color=141414&border_radius=0"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Carte des langages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&locale=fr&bg_color=F1EBDD&title_color=2F54EB&text_color=141414&border_color=141414&border_radius=0"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Carte de la série de contributions
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&locale=fr&background=F1EBDD&border=141414&stroke=141414&ring=2F54EB&fire=2F54EB&currStreakNum=141414&sideNums=141414&currStreakLabel=2F54EB&sideLabels=6B6457&dates=6B6457&border_radius=0"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enregistrer les cartes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Mise à jour des cartes" || exit 0
          git push
